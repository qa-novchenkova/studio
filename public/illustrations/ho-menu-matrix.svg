<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720"><rect width="1120" height="720" fill="#FFF6E8"/><rect x="104" y="104" width="448" height="248" rx="22" fill="#FFFFFF" stroke="#E8D6C0" stroke-width="2"/><circle cx="162" cy="166" r="30" fill="#4B7F52" opacity=".16"/><text x="162" y="180" text-anchor="middle" font-family="Bookman Old Style,Georgia,serif" font-size="40" font-weight="bold" fill="#4B7F52">?</text><text x="212" y="162" font-family="Bookman Old Style,Georgia,serif" font-size="34" font-weight="bold" fill="#2A1620">Загадки</text><text x="212" y="198" font-family="Arial,sans-serif" font-size="21" fill="#8A6B58">маржа есть, спроса нет</text><rect x="136" y="246" width="368" height="4" rx="2" fill="#4B7F52" opacity=".3"/><text x="136" y="292" font-family="Arial,sans-serif" font-size="23" fill="#2A1620">Переписать описание,</text><text x="136" y="326" font-family="Arial,sans-serif" font-size="23" fill="#2A1620">поднять выше в разделе</text><rect x="568" y="104" width="448" height="248" rx="22" fill="#FFFFFF" stroke="#E8D6C0" stroke-width="2"/><circle cx="626" cy="166" r="30" fill="#E0A100" opacity=".16"/><path d="M626 148 l6.4 13 14.4 2-10.4 10.2 2.5 14.3-13-6.8-13 6.8 2.5-14.3-10.4-10.2 14.4-2z" fill="#E0A100"/><text x="676" y="162" font-family="Bookman Old Style,Georgia,serif" font-size="34" font-weight="bold" fill="#2A1620">Звёзды</text><text x="676" y="198" font-family="Arial,sans-serif" font-size="21" fill="#8A6B58">любят и приносят маржу</text><rect x="600" y="246" width="368" height="4" rx="2" fill="#E0A100" opacity=".3"/><text x="600" y="292" font-family="Arial,sans-serif" font-size="23" fill="#2A1620">Держать в топе страницы,</text><text x="600" y="326" font-family="Arial,sans-serif" font-size="23" fill="#2A1620">выносить в спецпредложения</text><rect x="104" y="368" width="448" height="248" rx="22" fill="#FFFFFF" stroke="#E8D6C0" stroke-width="2"/><circle cx="162" cy="430" r="30" fill="#8A6B58" opacity=".16"/><path d="M151 419 l22 22 M173 419 l-22 22" stroke="#8A6B58" stroke-width="7" stroke-linecap="round"/><text x="212" y="426" font-family="Bookman Old Style,Georgia,serif" font-size="34" font-weight="bold" fill="#2A1620">Аутсайдеры</text><text x="212" y="462" font-family="Arial,sans-serif" font-size="21" fill="#8A6B58">не берут и не зарабатывают</text><rect x="136" y="510" width="368" height="4" rx="2" fill="#8A6B58" opacity=".3"/><text x="136" y="556" font-family="Arial,sans-serif" font-size="23" fill="#2A1620">Убрать из меню</text><text x="136" y="590" font-family="Arial,sans-serif" font-size="23" fill="#2A1620">или полностью переделать</text><rect x="568" y="368" width="448" height="248" rx="22" fill="#FFFFFF" stroke="#E8D6C0" stroke-width="2"/><circle cx="626" cy="430" r="30" fill="#D5283A" opacity=".16"/><path d="M613 446 l13 -24 13 24 z" fill="#D5283A"/><circle cx="626" cy="415" r="7.5" fill="#D5283A"/><text x="676" y="426" font-family="Bookman Old Style,Georgia,serif" font-size="34" font-weight="bold" fill="#2A1620">Рабочие лошадки</text><text x="676" y="462" font-family="Arial,sans-serif" font-size="21" fill="#8A6B58">берут часто, маржа низкая</text><rect x="600" y="510" width="368" height="4" rx="2" fill="#D5283A" opacity=".3"/><text x="600" y="556" font-family="Arial,sans-serif" font-size="23" fill="#2A1620">Пересчитать себестоимость,</text><text x="600" y="590" font-family="Arial,sans-serif" font-size="23" fill="#2A1620">добавить выгодный гарнир</text><text x="560" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#8A6B58">ВЫСОКАЯ МАРЖА</text><text x="560" y="698" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#8A6B58">НИЗКАЯ МАРЖА</text><text x="30" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#8A6B58" transform="rotate(-90 30 360)">РЕДКО ЗАКАЗЫВАЮТ</text><text x="1090" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#8A6B58" transform="rotate(90 1090 360)">ЧАСТО ЗАКАЗЫВАЮТ</text></svg>