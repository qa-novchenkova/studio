<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" width="1400" height="470"><rect width="1400" height="470" fill="#F7F5F1" rx="20"/><line x1="140" y1="190" x2="1260" y2="190" stroke="#D9D5CC" stroke-width="3"/><rect x="149" y="164" width="52" height="52" fill="#FFFFFF" stroke="#157A6E" stroke-width="3" transform="rotate(45 175 190)"/><text x="175" y="198" text-anchor="middle" font-family="Courier New, monospace" font-size="22" fill="#157A6E">1</text><text x="175" y="286" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="27" font-weight="bold" fill="#152420">Увидел объявление</text><text x="175" y="322" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="21" fill="#8C948F">фото и планировка</text><rect x="499" y="164" width="52" height="52" fill="#FFFFFF" stroke="#157A6E" stroke-width="3" transform="rotate(45 525 190)"/><text x="525" y="198" text-anchor="middle" font-family="Courier New, monospace" font-size="22" fill="#157A6E">2</text><text x="525" y="286" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="27" font-weight="bold" fill="#152420">Написал / позвонил</text><text x="525" y="322" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="21" fill="#8C948F">ждёт ответа минуты</text><rect x="849" y="164" width="52" height="52" fill="#FFFFFF" stroke="#157A6E" stroke-width="3" transform="rotate(45 875 190)"/><text x="875" y="198" text-anchor="middle" font-family="Courier New, monospace" font-size="22" fill="#157A6E">3</text><text x="875" y="286" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="27" font-weight="bold" fill="#152420">Приехал на показ</text><text x="875" y="322" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="21" fill="#8C948F">сверяет с ожиданием</text><rect x="1199" y="164" width="52" height="52" fill="#FFFFFF" stroke="#157A6E" stroke-width="3" transform="rotate(45 1225 190)"/><text x="1225" y="198" text-anchor="middle" font-family="Courier New, monospace" font-size="22" fill="#157A6E">4</text><text x="1225" y="286" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="27" font-weight="bold" fill="#152420">Принял решение</text><text x="1225" y="322" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="21" fill="#8C948F">сравнивает 2–3 варианта</text><text x="700" y="86" text-anchor="middle" font-family="Courier New, monospace" font-size="20" fill="#C08A2E" letter-spacing="3">ОТ ОБЪЯВЛЕНИЯ ДО СДЕЛКИ</text></svg>